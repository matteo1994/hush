[package]
name = "hush"
version = "0.1.26"
edition = "2024"
license = "Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword = "7"
age = "0.12"
rand = "0.8"
httparse = "1"
anyhow = "1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustls-native-certs = "0.8.5"
time = "0.3.55"
pem = "4"
libc = "0.2"

# The keychain unlock for `hush run` (keychain.rs). security-framework is
# already here through rustls-native-certs.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "LAContext", "LAError", "block2"] }

[dev-dependencies]
x509-parser = "0.18"

[lints.rust]
# Set by cargo-fuzz; see fuzz/.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
