[package]
name = "hush-secrets"
version = "0.1.28"
edition = "2024"
# cargo install ignores rust-toolchain.toml; File::lock needs 1.89.
rust-version = "1.89"
license = "Apache-2.0"
description = "A placeholder-swap credential proxy that keeps real API keys out of an AI coding agent's environment, context and transcript"
repository = "https://github.com/matteo1994/hush"
# crates.io shows this short page; it links to the full README on GitHub.
readme = "crates-io.md"
keywords = ["secrets", "proxy", "api-keys", "ai-agents", "credentials"]
categories = ["command-line-utilities", "cryptography", "network-programming"]
# The crate is published as hush-secrets (hush was taken); the program and the
# library the fuzz targets use are still called hush.
include = ["/src", "/tests", "/build.rs", "/Cargo.lock", "/README.md", "/crates-io.md", "/LICENSE", "/SECURITY.md", "/CHANGELOG.md"]

[lib]
name = "hush"
path = "src/lib.rs"

[[bin]]
name = "hush"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword = "7"
age = "0.12"
rand = "0.8"
httparse = "1"
anyhow = "1"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustls-native-certs = "0.8.5"
time = "0.3.55"
pem = "4"
libc = "0.2"

# The keychain unlock for `hush run` (keychain.rs). security-framework is
# already here through rustls-native-certs.
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { version = "0.3.2", default-features = false, features = ["std", "LAContext", "LAError", "block2"] }

[dev-dependencies]
x509-parser = "0.18"

[lints.rust]
# Set by cargo-fuzz; see fuzz/.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
