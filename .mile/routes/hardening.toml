[[stones.steps]]
id = "strip-accept-encoding-on-requests-to-bound-hosts"
title = "Strip Accept-Encoding on requests to bound hosts"
notes = "So responses come back uncompressed and can be scanned"
status = "done"
created_at = "2026-09-27T19:10:08.258993Z"
completed_at = "2026-10-09T01:54:35.881620Z"

[[stones.steps]]
id = "redact-the-real-value-in-bound-host-responses-with-a-same-length-marker"
title = "Redact the real value in bound-host responses with a same-length marker"
notes = "Same length keeps Content-Length and chunk sizes valid; covers headers and body"
status = "done"
created_at = "2026-09-27T19:10:08.268866Z"
completed_at = "2026-10-09T01:54:35.893947Z"

[[stones.steps]]
id = "catch-a-key-split-across-reads-with-a-carry-over-buffer"
title = "Catch a key split across reads with a carry-over buffer"
notes = "Hold back len(key)-1 bytes between reads"
status = "done"
created_at = "2026-09-27T19:10:08.277218Z"
completed_at = "2026-10-09T01:54:35.905575Z"

[[stones]]
id = "plain-http"
title = "Plain HTTP"
created_at = "2026-09-27T19:10:08.285652Z"

[[stones.steps]]
id = "swap-over-plain-http-only-when-the-target-is-loopback"
title = "Swap over plain HTTP only when the target is loopback"
notes = "Otherwise the real key crosses the network unencrypted"
status = "done"
created_at = "2026-09-27T19:10:08.285653Z"
completed_at = "2026-10-09T01:54:35.851798Z"

[[stones.steps]]
