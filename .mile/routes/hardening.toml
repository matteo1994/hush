[[stones.steps]]
id = "evaluate-touch-id-confirmation-for-vault-changes"
title = "Evaluate Touch ID confirmation for vault changes"
notes = "A child can't fake it, unlike the HUSH_ACTIVE warning; likely needs a code-signed binary. Could also replace the per-run passphrase Spike 2026-10-25: a Touch ID-gated keychain item needs a paid Developer ID and a provisioning profile (unsigned: -34018; ad-hoc with the entitlement: killed). An LAContext check plus a plain login-keychain item works unsigned once hush has the hardened runtime; see agent-apps' prompt-for-the-passphrase-without-a-terminal."
status = "todo"
created_at = "2026-09-27T19:10:08.306477Z"
