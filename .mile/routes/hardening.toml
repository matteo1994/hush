[[stones.steps]]
id = "refuse-a-second-binding-for-the-same-env-instead-of-ignoring-it"
title = "Refuse a second binding for the same env instead of ignoring it"
notes = "find_binding takes the first match, so 'secret bind NAME --host X' without --env, when an unscoped binding exists, is accepted but never used. Reject it and suggest --env"
status = "done"
