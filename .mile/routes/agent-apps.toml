[[stones.steps]]
id = "launch-a-gui-app-under-hush-run-refusing-when-it-is-already-running"
title = "Launch a GUI app under hush run, refusing when it is already running"
notes = "e.g. hush run -- /Applications/Cursor.app/Contents/MacOS/Cursor. 'open -a' doesn't work: LaunchServices starts the app with launchd's environment, not hush's. A single-instance app that's already running receives the launch and keeps its old environment, so detect that and refuse with a clear message."
status = "todo"
created_at = "2026-10-19T02:31:04.080493Z"

[[stones.steps]]
id = "prompt-for-the-passphrase-without-a-terminal"
title = "hush run unlocks the vault with Touch ID and the login keychain when there is no terminal"
notes = "Design from the 2026-10-25 spike (Intel MBP, macOS 15.8.1, unsigned binary): a Touch ID-gated keychain item (data-protection keychain, or kSecAttrAccessControl with biometry) fails with -34018 missing entitlement, and ad-hoc signing with keychain-access-groups is killed at launch; that route needs a paid Developer ID and a provisioning profile, so it is out for now. What works: a plain login-keychain generic password, which only the binary that created it reads without a prompt (another program, or the same path rebuilt with different code, gets a SecurityAgent dialog), plus LAContext deviceOwnerAuthenticationWithBiometrics, which works unsigned. Plan: 'hush keychain enable' takes the passphrase once and stores it; 'hush keychain disable' removes it. Only 'hush run' with no terminal uses it, after a Touch ID check; every vault change still needs the typed passphrase, so an agent that runs hush itself cannot rebind a key. Each hush upgrade asks once for the login password. Only a hush signed with the hardened runtime may create the item (see sign-the-macos-binary-ad-hoc-with-the-hardened-runtime): an unsigned hush loads DYLD_INSERT_LIBRARIES code that could read it and skip Touch ID. The protection is the OS refusing the library plus the item trusting only that signed binary; harden::hardened_runtime asks the process itself, so it may refuse an honest unsigned hush with a clear message but is never the boundary (PR #48 review). Open: several wrapped MCP servers starting at once would each ask for Touch ID."
status = "done"
created_at = "2026-10-19T02:31:04.091630Z"
completed_at = "2026-10-27T02:18:46.824159Z"

[[stones.steps]]
id = "make-a-launcher-that-starts-an-app-through-hush"
title = "Make a launcher that starts an app through hush"
notes = "macOS only: e.g. 'hush app add Cursor' writes a small .app bundle to ~/Applications that runs hush run on the app's binary, so it opens from the Dock or Spotlight. 'open -a' doesn't work: LaunchServices starts the app with launchd's environment. It must not write the passphrase anywhere."
status = "todo"
created_at = "2026-10-19T02:31:04.103954Z"

[[stones.steps]]
id = "start-a-separate-app-instance-with-its-own-profile-directory-under-hush-run"
title = "Start a separate app instance with its own profile directory under hush run"
notes = "A single-instance app that's already running receives a new launch and keeps its old environment. VS Code and Electron apps accept --user-data-dir, which starts a separate instance with hush's env; prefer that, and refuse only when the app has no such option."
status = "todo"
created_at = "2026-10-25T22:40:44.592652Z"

[[stones.steps]]
id = "sign-the-macos-binary-ad-hoc-with-the-hardened-runtime"
title = "Sign the macOS binary ad-hoc with the hardened runtime"
notes = "Spike 2026-10-25: DYLD_INSERT_LIBRARIES injects code into the unsigned hush (and any unsigned binary); 'codesign -s - -o runtime' (no Apple account) blocks it, hush still runs, and plain keychain items still work. README's Installing already gives the codesign line; hush is built from source, so CI has no release binary to sign. Done here: harden::hardened_runtime (csops CS_RUNTIME), a one-time warning before the first prompt of an unhardened hush, and DYLD_INSERT_LIBRARIES in the threat model. The keychain unlock will refuse without it."
status = "done"
created_at = "2026-10-25T23:24:42.017071Z"
completed_at = "2026-10-25T23:55:29.137241Z"

[[stones.steps]]
id = "one-touch-id-prompt-covers-mcp-servers-started-together"
title = "One Touch ID prompt covers MCP servers started together"
notes = "Claude desktop starts every configured MCP server at launch; with three wrapped in hush run, each would ask for Touch ID. Options: reuse an LAContext approval for a short window (LAContext touchIDAuthenticationAllowableReuseDuration is per context, so it doesn't carry across processes), or a short-lived unlock shared by runs started within seconds of each other. Must not give a later, unrelated hush run a silent unlock. Seen 2026-10-26: Claude desktop (3.6556.2) starts each configured server twice (two hush run processes, via its 'disclaimer' helper), so even one wrapped server asks for Touch ID twice per app launch."
status = "todo"
created_at = "2026-10-25T23:31:02.712649Z"

