[[stones.steps]]
id = "claude-desktop-s-mcp-servers-run-under-hush-with-no-key-in-claude-desktop-config-json"
title = "Claude desktop's MCP servers run under hush with no key in claude_desktop_config.json"
notes = "Verified 2026-10-25 (Claude 3.6556.2, hush 0.1.25): an mcpServers entry with command /Users/…/.cargo/bin/hush and args [run, --secret NAME, --, python3, server.py] works started from the Dock. The server gets the placeholder, HTTPS_PROXY and SSL_CERT_FILE; stdio passes through; stderr stays quiet; a postman-echo request was swapped and the echo scrubbed. The app hands MCP servers the login shell's PATH. Only blocker: the test passed HUSH_PASSPHRASE in the entry's env, so done means no passphrase or key in the config (needs prompt-for-the-passphrase-without-a-terminal), plus a README recipe."
status = "done"
