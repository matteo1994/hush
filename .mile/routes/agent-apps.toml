id = "agent-apps"
title = "Agent apps"
description = "Run hush under AI agent apps people start from the Dock or Spotlight rather than a terminal, on macOS only (Linux keeps the terminal flow): the Claude desktop app's MCP servers first, then VS Code with the Claude Code extension, Cursor, Windsurf, Zed. These apps start their child processes with no terminal for the passphrase prompt, single-instance apps hand a second launch to the running one, and Chromium-based ones ignore HTTPS_PROXY and trust only the Keychain. Apps that sign in with an account (Claude chat, Copilot) or route a user's key through their own servers (Cursor) have no key hush can swap."
archived = false
created_at = "2026-10-19T02:31:03.926679Z"

