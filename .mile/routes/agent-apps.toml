[[stones.steps]]
id = "get-chromium-based-apps-to-use-the-proxy-and-trust-the-run-s-ca"
title = "Get Chromium-based apps to use the proxy and trust the run's CA"
notes = "Electron renderers use Chromium's network stack: on macOS it uses the system proxy and keychain, not env vars. Candidates: --proxy-server and --ignore-certificate-errors-spki-list (would need one leaf key per run, so a single SPKI hash covers every host), or only supporting apps whose requests go through Node (NODE_USE_ENV_PROXY, NODE_EXTRA_CA_CERTS). Depends on the survey."
status = "todo"
created_at = "2026-10-19T02:31:04.115120Z"

[[stones.steps]]
id = "stable-placeholders-for-keys-an-app-stores-in-its-own-settings"
title = "Stable placeholders for keys an app stores in its own settings"
notes = "Apps like Cline or Zed keep a pasted key in their settings and send it every request, but hush mints a new random placeholder each run, so a pasted one stops matching. A placeholder fixed per secret (and profile) would work; it is only swapped toward the bound host, so it looks harmless, but check the threat model (it persists in app config, and a leaked one names which secret it is)."
status = "todo"
created_at = "2026-10-25T22:40:44.579735Z"

