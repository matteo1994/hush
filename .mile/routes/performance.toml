title = "Decide the vault unlock cost"
notes = "age's scrypt is tuned to about a second and is ~1.2 s of the ~1.3 s start-up. Options: keep it, lower the work factor, or unlock with a key held in the macOS Keychain behind Touch ID (ties into the benched hardening step evaluate-touch-id-confirmation-for-vault-changes). Security trade-off: the user decides."
