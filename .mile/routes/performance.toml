id = "performance"
title = "Performance"
description = "Time hush and keep it under control. Baseline 2026-10-15 (0.1.5, throwaway vault, macOS): hush run with no names 52 ms; with one secret ~1.3 s, nearly all of it age's scrypt unlock (secret ls alone ~1.38 s); claude --version 58 ms direct vs 1271 ms via hush. Every change is measured against the bench script before and after."
archived = false
created_at = "2026-10-15T02:42:33.805529Z"

