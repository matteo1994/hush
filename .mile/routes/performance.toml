[[stones.steps]]
id = "hold-back-only-bytes-that-could-start-a-key-in-the-scrubber"
title = "Hold back only bytes that could start a key in the Scrubber"
notes = "Scrubber::feed keeps the last longest-1 bytes of every write until more data or the end arrives, so on a streamed response from a bound host each event's tail arrives one event late. Hold back only the longest suffix that is a prefix of some real value: just as safe, and events are released on time."
status = "done"
created_at = "2026-10-15T02:42:33.869711Z"
completed_at = "2026-10-25T23:31:02.854841Z"

