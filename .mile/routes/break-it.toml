[[stones.steps]]
id = "check-hush-s-own-output-never-quotes-a-header-or-value"
title = "Check hush's own output never quotes a header or value"
notes = "ErrorLog summary after the child exits, 502 bodies, warnings from run and secret commands, panic messages. None may contain a real value, even from an error raised mid-substitution."
status = "done"
created_at = "2026-10-13T03:40:46.413325Z"
completed_at = "2026-10-17T16:08:43.432535Z"

[[stones.steps]]
id = "document-that-a-vendor-s-key-minting-endpoint-returns-a-key-hush-cannot-scrub"
title = "Document that a vendor's key-minting endpoint returns a key hush cannot scrub"
notes = "The child can use the key for anything the vendor API allows, including creating a new API key and reading it from the response. The Scrubber only knows vault values. Threat model text; recommend restricted keys where the vendor offers them."
status = "done"
created_at = "2026-10-13T03:40:46.423231Z"
completed_at = "2026-10-17T18:17:49.669976Z"

