[[stones.steps]]
id = "check-every-response-path-goes-through-the-scrubber"
title = "Check every response path goes through the Scrubber"
notes = "101, close-delimited bodies, unparsable response heads passed through to close, trailers, interim 1xx, HEAD, response headers. Use a test upstream that echoes the Authorization header on each path."
