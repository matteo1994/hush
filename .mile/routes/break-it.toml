id = "break-it"
title = "Break It"
description = "White-hat attempts to break hush. The attacker is the hush run child: a prompt-injected agent running as the user, holding the placeholders and the proxy. It wins if it reads a real value, gets one sent to a host it controls, or changes the vault. Each finding becomes a failing test first, then a fix or a line in the threat model."
archived = false
created_at = "2026-10-13T03:40:46.338378Z"

[[stones]]
id = "wire"
title = "wire"
created_at = "2026-10-13T03:40:46.348701Z"

[[stones.steps]]
id = "send-a-bound-host-s-key-to-another-origin-via-the-inner-host-header"
title = "Send a bound host's key to another origin via the inner Host header"
notes = "On an intercepted connection hush matches the CONNECT authority only and forwards the inner Host header as the client sent it (handle_connect -> forward). If the bound host is on a shared CDN, CONNECT to it with Host: an attacker site on the same CDN may deliver the real key to the attacker's origin. Likely fix: require the inner Host to equal the CONNECT authority, else no substitution (silent pass-through, not an error)."
status = "done"
created_at = "2026-10-13T03:40:46.348704Z"
completed_at = "2026-10-14T03:44:29Z"

[[stones.steps]]
id = "capture-a-localhost-bound-key-by-listening-on-another-port"
title = "Capture a localhost-bound key by listening on another port"
notes = "Bindings compare host only, not port, and a loopback upstream skips the allow_http check. For a secret bound to localhost or 127.0.0.1 the child can listen on a port of its own, or take the dev server's port while it is down, and ask the proxy to send the key there. Decide: optional port in a binding, or document that loopback bindings are readable by the child."
status = "done"
created_at = "2026-10-13T03:40:46.360505Z"
completed_at = "2026-10-15T02:13:35Z"

[[stones.steps]]
id = "try-request-smuggling-over-a-kept-alive-intercepted-connection"
title = "Try request smuggling over a kept-alive intercepted connection"
notes = "Conflicting Content-Length and Transfer-Encoding, duplicate Content-Length, bare LF, folded headers, chunk extensions. Goal: a request or response the proxy and the upstream frame differently, so a substituted header lands somewhere unintended or a response reaches the client unscrubbed."
status = "done"
created_at = "2026-10-13T03:40:46.371595Z"
completed_at = "2026-10-15T02:59:50.820232Z"

[[stones.steps]]
id = "try-odd-spellings-of-a-bound-host"
title = "Try odd spellings of a bound host"
notes = "Trailing dot, userinfo (http://bound@evil/), IPv6 literals and brackets, mixed case, IDN/punycode, port tricks in split_host_port and resolve_target. Failing closed (no substitution) is fine; look for the matched host and the connected host differing."
status = "done"
created_at = "2026-10-13T03:40:46.383243Z"
completed_at = "2026-10-16T04:39:52.970524Z"

[[stones.steps]]
id = "fuzz-the-request-head-parser-chunk-decoder-and-scrubber"
title = "Fuzz the request head parser, chunk decoder and Scrubber"
notes = "cargo-fuzz targets for read_head, parse_head, parse_response_head, the chunked relay and Scrubber. Look for panics, hangs, unbounded memory, and a real value surviving any split of the input."
status = "done"
created_at = "2026-10-13T03:40:46.393284Z"
completed_at = "2026-10-17T00:17:50.062022Z"

[[stones.steps]]
id = "capture-a-key-bound-to-this-machine-s-lan-address-by-listening-on-another-port"
title = "Capture a key bound to this machine's LAN address by listening on another port"
notes = "A connection to one of this machine's own non-loopback addresses (LAN address, or a name like mymac.local resolving to it) wasn't counted as local, so a binding there without a port and with --allow-http sent the key to any port the child listened on. Fix: Target::this_machine counts peer == local address as local, so only the exact address and port bound gets it (PR #18)."
status = "done"
created_at = "2026-10-16T04:10:23.637702Z"
completed_at = "2026-10-16T04:39:52.981297Z"

