[[stones.steps]]
id = "try-to-read-the-secrets-from-the-hush-run-process"
title = "Try to read the secrets from the hush run process"
notes = "Same user as the child: debugger attach (lldb, task_for_pid), and a core dump forced by signalling the parent (SIGQUIT/SIGABRT). README lists memory reads as out of scope, but cheap mitigations may exist: RLIMIT_CORE 0, PT_DENY_ATTACH on macOS, PR_SET_DUMPABLE 0 on Linux."
status = "done"
created_at = "2026-10-13T03:40:46.433372Z"
completed_at = "2026-10-17T18:37:14.916445Z"

[[stones.steps]]
id = "tamper-with-the-vault-and-the-run-directory"
title = "Tamper with the vault and the run directory"
notes = "Roll vault.age back to an older copy to revive a removed binding, swap or delete vault.age, vault.lock, global.env and the run's ca.pem/ca-bundle.pem, race the tmp-then-rename in save_vault. Check what the vault integrity work already catches."
status = "done"
created_at = "2026-10-13T03:40:46.444333Z"
completed_at = "2026-10-17T18:55:52.847986Z"

[[stones.steps]]
id = "capture-the-passphrase-for-the-next-run"
title = "Capture the passphrase for the next run"
notes = "A fake passphrase prompt printed by the child, a replaced ~/.cargo/bin/hush, a PATH or shell rc edit. A same-user child can do all of these, so this probably ends in threat model text and advice, not a fix."
status = "done"
created_at = "2026-10-13T03:40:46.455052Z"
completed_at = "2026-10-17T19:12:22.831428Z"

