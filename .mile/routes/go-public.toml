id = "go-public"
title = "Go public"
description = "Make the repository ready to switch from private to public: docs that match what hush does, a way to report vulnerabilities, a stable toolchain, then the switch itself and what it unlocks. Finish the profiles steps in usability first."
archived = false
created_at = "2026-10-19T02:30:28.929014Z"

[[stones]]
id = "docs"
title = "docs"
