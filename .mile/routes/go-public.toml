[[stones.steps]]
id = "readme-install-instructions-match-the-threat-model"
title = "README install instructions match the threat model"
notes = "Building says cargo install --path . (into ~/.cargo/bin), while the threat model says install where only an administrator can write; and it claims no system dependencies and pure-Rust crypto, but ring needs a C compiler. Fix both."
status = "done"
created_at = "2026-10-19T02:30:48.631155Z"
completed_at = "2026-10-20T02:43:17.815297Z"

[[stones.steps]]
id = "replace-the-mile-and-typesafe-api-key-examples-with-generic-ones"
title = "Replace the mile and TYPESAFE_API_KEY examples with generic ones"
notes = "README (global.env, --secret) and the names.rs doc comment use mile crew / TYPESAFE_API_KEY, which mean nothing outside this setup. Use a generic globally installed tool and key."
status = "done"
created_at = "2026-10-19T02:30:48.642328Z"
completed_at = "2026-10-20T02:42:52.686032Z"

[[stones.steps]]
id = "add-security-md-with-how-to-report-a-vulnerability-privately"
title = "Add SECURITY.md with how to report a vulnerability privately"
notes = "Point at GitHub private vulnerability reporting; say which versions get fixes (latest release) and what's out of scope (the README threat model's non-goals)."
status = "done"
created_at = "2026-10-19T02:30:48.654927Z"
completed_at = "2026-10-20T02:44:52.724954Z"

