[[stones.steps]]
id = "build-on-a-pinned-stable-toolchain-instead-of-nightly"
title = "Build on a pinned stable toolchain instead of nightly"
notes = "Nothing needs nightly: the full suite passes on 1.99.0. Pin 1.99.0 in rust-toolchain.toml so ordinary rustup users can build; fuzz/ keeps nightly (cargo fuzz asks for it). Update CLAUDE.md's toolchain line."
status = "done"
created_at = "2026-10-19T02:30:48.667086Z"
completed_at = "2026-10-20T02:44:52.736007Z"

