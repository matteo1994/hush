id = "turn-on-private-vulnerability-reporting-in-the-repo-settings"
title = "Turn on private vulnerability reporting in the repo settings"
notes = "GitHub only offers it on public repos (the API gives 404 while private), so right after making the repo public: Settings > Security (or Code security) > Private vulnerability reporting. SECURITY.md points at it, so don't leave a gap."
