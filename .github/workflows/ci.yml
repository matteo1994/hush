name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly, so an advisory published against a locked dependency shows up
  # without waiting for the next change.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  # The event is part of the group, so a scheduled run on master never
  # cancels a push run there, and with it a release. Only a pull request's
  # runs are cancelled by a newer push: on master that could stop a bump
  # between its commit and its push, or, since the release push starts CI
  # too, cancel the run that has just released. Runs there queue instead,
  # and bump-version.sh leaves a run that master has passed to the newer one.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS too: harden.rs's macOS paths and the keychain-backed trust
        # store only run there. Free on a public repo; on a private one macOS bills at 10x.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The lint job runs on Linux, where macOS-only code isn't compiled.
      - if: runner.os == 'macOS'
        run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # Known advisories against Cargo.lock (RustSec), ignores in deny.toml.
  # Not a prerequisite of bump: an advisory published against a dependency
  # shouldn't hold back the release that updates it.
  audit:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --locked check advisories

  # Every merge to master that changes the program gets its own patch
  # version, a CHANGELOG.md entry and a `v<version>` tag, once lint and tests
  # pass. Master's ruleset only lets a pull request change it, and a personal
  # repository can't list GitHub Actions as a bypass actor, so the release is
  # pushed with a deploy key (secret RELEASE_DEPLOY_KEY) that the ruleset lets
  # through. That push starts CI again on the release commit, whose bump finds
  # nothing changed since the new tag and stops.
  bump:
    name: bump version
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # One at a time, and never cancelled by another bump.
    concurrency:
      group: bump-version
    steps:
      - name: Check for the deploy key
        env:
          KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::RELEASE_DEPLOY_KEY is not set, so the release can't be pushed past master's ruleset"
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          # Full history, so the existing tags are there to compare against.
          fetch-depth: 0
          # This key bypasses master's ruleset, and checkout leaves it in the
          # git config for the steps after it. Keep this job to checkout and
          # bump-version.sh: no third-party actions, no cargo build.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .github/scripts/bump-version.sh
