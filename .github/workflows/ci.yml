name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly, so an advisory published against a locked dependency shows up
  # without waiting for the next change.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  # The event is part of the group, so a scheduled run on master never
  # cancels a push run there, and with it a release.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Linux only: on a private repo macOS minutes bill at 10x. Run
        # `cargo test` on a Mac before opening a PR that touches the macOS
        # code (harden.rs, the keychain-backed trust store).
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  # Known advisories against Cargo.lock (RustSec), ignores in deny.toml.
  # Not a prerequisite of bump: an advisory published against a dependency
  # shouldn't hold back the release that updates it.
  audit:
    name: advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: cargo deny --locked check advisories

  # Every merge to master that changes the program gets its own patch
  # version, a CHANGELOG.md entry and a `v<version>` tag, once lint and tests
  # pass. The push uses GITHUB_TOKEN, which doesn't trigger workflows, so the
  # release commit can't start another release.
  bump:
    name: bump version
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One at a time, and never cancelled by another bump.
    concurrency:
      group: bump-version
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history, so the existing tags are there to compare against.
          fetch-depth: 0
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          .github/scripts/bump-version.sh
